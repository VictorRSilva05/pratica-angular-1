<div class="container">
  <div class="card">
    <label for="name">Name:</label>
    <input type="text" id="name" [formControl]="name">

    <label for="email">Email:</label>
    <input type="text" id="email" [formControl]="email">
    <p>Current name: {{ name.value }}</p>

    <button [disabled]="email.invalid || name.invalid" (click)="registerLogs()">Register</button>
  </div>
</div>
