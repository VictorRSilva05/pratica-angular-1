<div class="container">
  <form [formGroup]="userForm">
    <div class="card">
      <label for="name">Name:</label>
      <input type="text" id="name" formControlName="name">

      <label for="email">Email:</label>
      <input type="text" id="email" formControlName="email">

      <p>Current name: {{ userForm.value.name }}</p>

      <button type="button" [disabled]="userForm.invalid" (click)="registerLogs()">Register</button>

      <p *ngIf="notification">{{notification}}</p>
    </div>
  </form>

  <app-notification [username]="userForm.value.name ?? ''"  (notificationSent)="showNotification($event)"></app-notification>
</div>
